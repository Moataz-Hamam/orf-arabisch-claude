name: Nachrichten aktualisieren & Website veröffentlichen

on:
  schedule:
    # Alle 3 Stunden
    - cron: "0 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "news-and-pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Nachrichten abrufen und übersetzen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run translate

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "Keine neuen Nachrichten."
          else
            git commit -m "chore: Nachrichten aktualisiert [skip ci]"
            git push
          fi

      - name: Pages-Artefakt vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
